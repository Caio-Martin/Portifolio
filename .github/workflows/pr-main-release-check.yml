name: PR to Main - Release Check

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate static files
        run: npm run validate
      - name: Test static validation regressions
        run: npm run test:static

      - name: Build and validate publication artifact
        run: npm run build

      - name: Run Cypress smoke locally
        uses: cypress-io/github-action@v7
        with:
          install: false
          config: baseUrl=http://127.0.0.1:4174
          start: npm run serve:dist
          wait-on: http://127.0.0.1:4174
          wait-on-timeout: 120
          browser: chrome
