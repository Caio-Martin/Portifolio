name: PR to Main - Release Check

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-release:
    runs-on: ubuntu-latest
    env:
      CYPRESS_BASE_URL: ${{ vars.PAGES_BASE_URL != '' && vars.PAGES_BASE_URL || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Validate static files
        run: npm run validate

      - name: Run Cypress against deployed endpoint
        run: npm run cypress:live
