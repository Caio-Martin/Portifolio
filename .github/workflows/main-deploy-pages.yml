name: Main - Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate source files
        run: npm run validate
      - name: Test static validation regressions
        run: npm run test:static
      - name: Build and validate publication artifact
        run: npm run build
      - name: Test publication artifact before deploy
        uses: cypress-io/github-action@v7
        with:
          install: false
          start: npm run serve:dist
          wait-on: http://127.0.0.1:4174
          wait-on-timeout: 120
          browser: chrome
          config: baseUrl=http://127.0.0.1:4174
      - name: Save validated artifact
        uses: actions/upload-artifact@v4
        with:
          name: validated-site
          path: dist/
          retention-days: 1

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download validated artifact
        uses: actions/download-artifact@v4
        with:
          name: validated-site
          path: dist
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  smoke-test-production:
    needs: deploy
    runs-on: ubuntu-latest
    env:
      CYPRESS_BASE_URL: ${{ needs.deploy.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Wait for deployed endpoint
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsSL "${CYPRESS_BASE_URL}" > /dev/null; then
              exit 0
            fi
            sleep 10
          done
          echo "Endpoint did not become available in time."
          exit 1
      - name: Run Cypress against deployed site
        run: npm run cypress:live
