name: Main - Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate static files
        run: npm run validate

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare static site artifact
        run: |
          mkdir public-site
          cp index.html public-site/
          cp portfolio.html public-site/
          cp contato.html public-site/
          cp styles.css public-site/
          cp script.js public-site/
          cp projects.js public-site/
          cp -r lib public-site/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  smoke-test-production:
    needs: deploy
    runs-on: ubuntu-latest
    env:
      CYPRESS_BASE_URL: ${{ needs.deploy.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Wait for deployed endpoint
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsSL "${CYPRESS_BASE_URL}" > /dev/null; then
              exit 0
            fi
            sleep 10
          done
          echo "Endpoint did not become available in time."
          exit 1

      - name: Run Cypress against deployed site
        run: npm run cypress:live
